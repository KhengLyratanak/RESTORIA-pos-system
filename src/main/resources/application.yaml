spring:
  application:
    name: New Demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

config:
  security:
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-token-expiration: 10800000

pagination:
  base-url: ${PUBLIC_API_URL:http://localhost:8080/api/v1}
  uri:
    product: /products/paginated
    stock: /stocks/paginated
    supplier: /suppliers/paginated
    user: /users/paginated
    order: /orders/paginated

