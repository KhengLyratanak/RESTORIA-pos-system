spring:
  application:
    name: New Demo

  # Local database. On Render these are replaced by SPRING_DATASOURCE_URL /
  # SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD (your Neon database).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/project}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

config:
  security:
    # Set JWT_SECRET in Render (and in IntelliJ for local runs). Never commit the real value.
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-token-expiration: 10800000

pagination:
  base-url: ${PUBLIC_API_URL:http://localhost:8080/api/v1}
  uri:
    product: /products/paginated
    stock: /stocks/paginated
    supplier: /suppliers/paginated
    user: /users/paginated
    order: /orders/paginated

bakong:
  base-url: https://api-bakong.nbc.gov.kh
  # Set BAKONG_TOKEN in Render (and in IntelliJ for local runs). Never commit the real value.
  token: ${BAKONG_TOKEN}
  account-id: abaakhppxxx@abaa
  account-information: "007902781"
  merchant-account: false
  merchant-id: ""
  acquiring-bank: "ABA Bank"
  merchant-name: LYRATANAK KHENG
  merchant-city: Phnom Penh
  terminal-label: POS-1
  qr-ttl-seconds: 600

# On startup, the user named in BOOTSTRAP_ADMIN (name or email) is given the ADMIN role.
# Off unless that environment variable is set — never leave it set on a public server.
app:
  bootstrap-admin: ${BOOTSTRAP_ADMIN:}