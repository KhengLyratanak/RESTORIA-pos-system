spring:
  application:
    name: New Demo

  # Render sets DB_URL / DB_USERNAME / DB_PASSWORD (your Neon database).
  # Without them (on your PC) the local database is used.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

config:
  security:
    # Render sets JWT_SECRET. The fallback is for running on your PC only.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration: 3600000
    refresh-token-expiration: 10800000

pagination:
  base-url: ${PUBLIC_API_URL:http://localhost:8080/api/v1}
  uri:
    product: /products/paginated
    stock: /stocks/paginated
    supplier: /suppliers/paginated
    user: /users/paginated
    order: /orders/paginated

bakong:
  base-url: https://api-bakong.nbc.gov.kh
  # Set BAKONG_TOKEN in Render. Without it the app still starts, but KHQR payment checks fail.
  token: ${BAKONG_TOKEN:}
  account-id: abaakhppxxx@abaa
  account-information: "007902781"
  merchant-account: false
  merchant-id: ""
  acquiring-bank: "ABA Bank"
  merchant-name: LYRATANAK KHENG
  merchant-city: Phnom Penh
  terminal-label: POS-1
  qr-ttl-seconds: 600

# On startup, the user named in BOOTSTRAP_ADMIN (name or email) is given the ADMIN role.
# Off unless that environment variable is set — never leave it set on a public server.
app:
  bootstrap-admin: ${BOOTSTRAP_ADMIN:}